# Prueba el backend y el stack completo (MySQL + Spring Boot + frontend con Nginx)
# tal como se despliega en la EC2: repositorios hermanos backend/ y frontend/.
name: CI VetSM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Rama del repositorio frontend a probar
        default: main

permissions:
  contents: read

jobs:
  verify:
    name: Probar backend y stack Docker
    runs-on: ubuntu-latest
    env:
      SPRING_PORT: 8080
      HTTP_PORT: 8081
      MYSQL_PASSWORD: ci_mysql_password_123456
      MYSQL_ROOT_PASSWORD: ci_root_password_123456
      JWT_SECRET: ci_jwt_secret_123456789012345678901234567890
      APP_ADMIN_EMAIL: admin@sanmarcos.cl
      APP_ADMIN_PASSWORD: ci_admin_password_123456
      APP_SEED_DEMO_CLIENT: "false"
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Roselin2831/VETERINARIA_SAN_MARCOS
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: frontend

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/veterinaria/pom.xml

      - name: Backend - compilar y correr tests
        working-directory: backend/veterinaria
        run: bash ./mvnw -B package

      - name: Compose - validar y construir imágenes
        run: |
          docker compose -f backend/docker-compose.aws.yml config --quiet
          docker compose -f backend/docker-compose.aws.yml build

      - name: Smoke test a través de Nginx (igual que el navegador)
        run: |
          docker compose -f backend/docker-compose.aws.yml up -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/api/health
          curl -fsS http://127.0.0.1:8081/api/products | head -c 200; echo
          curl -fsS http://127.0.0.1:8081/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://127.0.0.1:8081/categorias
          # Login con cabecera Origin del mismo sitio: no debe bloquearlo CORS
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/auth/login \
            -H 'Origin: http://127.0.0.1:8081' -H 'Content-Type: application/json' \
            -d "{\"email\":\"$APP_ADMIN_EMAIL\",\"password\":\"$APP_ADMIN_PASSWORD\"}")
          echo "login: $code"; test "$code" = 200

      - name: Logs si falla
        if: failure()
        run: docker compose -f backend/docker-compose.aws.yml logs --tail=100

      - name: Limpiar contenedores y base temporal
        if: always()
        run: docker compose -f backend/docker-compose.aws.yml down -v
