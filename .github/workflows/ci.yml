name: CI VetSM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stack:
    name: Backend, frontend y MySQL integrados
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend y pruebas HTTP
        working-directory: backend
        run: bash ./mvnw -B -ntp package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend y pruebas unitarias
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
          CHROME_BIN: /usr/bin/google-chrome
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Configuración temporal de pruebas
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          SPRING_PORT=8080
          HTTP_PORT=8081
          MYSQL_PASSWORD=ci_mysql_password_123456
          MYSQL_ROOT_PASSWORD=ci_root_password_123456
          JWT_SECRET=ci_jwt_secret_123456789012345678901234567890
          APP_ADMIN_EMAIL=admin@sanmarcos.cl
          APP_ADMIN_PASSWORD=Admin123!
          APP_SEED_DEMO_CLIENT=true
          EOF
      - name: Construir y levantar el stack
        run: |
          docker compose -f backend/docker-compose.aws.yml config --quiet
          docker compose -f backend/docker-compose.aws.yml build
          docker compose -f backend/docker-compose.aws.yml up -d --wait --wait-timeout 300
      - name: Verificar scripts y acceso a través de Nginx
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          bash deploy/verificar.sh
      - name: Navegador contra MySQL y Nginx
        working-directory: frontend
        env:
          FRONTEND_URL: http://127.0.0.1:8081
          API_URL: http://127.0.0.1:8081/api/v1
        run: npm run test:e2e
      - name: Evidencia
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-stack
          path: |
            backend/target/surefire-reports/
            frontend/coverage/
            frontend/playwright-report/
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose -f backend/docker-compose.aws.yml logs --tail=100
      - name: Limpiar el entorno temporal de CI
        if: always()
        run: docker compose -f backend/docker-compose.aws.yml down -v
