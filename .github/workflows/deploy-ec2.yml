# Compila backend (Spring Boot) y frontend (React/Vite) y los despliega en la EC2.
#
#  - "Compilar y probar" corre en los servidores de GitHub (la EC2 no gasta RAM compilando).
#  - "Desplegar en EC2" corre en un runner self-hosted instalado DENTRO de la EC2
#    (etiqueta "ec2"). El runner sale a buscar trabajos a GitHub, así que la EC2 no
#    necesita aceptar SSH desde internet ni hay llaves guardadas en GitHub.
#  - En Pull Requests solo se compila; nunca se despliega.
#
# Instalación del runner: ver DEPLOY-EC2.md

name: Deploy EC2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: veterinaria/pom.xml

      - name: Backend - compilar y correr tests
        working-directory: veterinaria
        run: mvn -B package

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - compilar
        working-directory: frontend
        env:
          # El frontend llama a /api en el mismo dominio; Nginx lo reenvía al backend.
          VITE_API_URL: /api
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Empaquetar
        run: |
          mkdir -p paquete
          cp veterinaria/target/veterinaria.jar paquete/
          tar -czf paquete/frontend.tgz -C frontend/dist .
          cp deploy/ec2-setup.sh paquete/
          ls -lh paquete

      - uses: actions/upload-artifact@v4
        with:
          name: paquete
          path: paquete/
          retention-days: 7

  deploy:
    name: Desplegar en EC2
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, ec2]
    outputs:
      host: ${{ steps.instalar.outputs.host }}
    steps:
      - name: Limpiar paquete anterior
        run: rm -rf paquete

      - uses: actions/download-artifact@v4
        with:
          name: paquete
          path: paquete

      - name: Instalar y reiniciar
        id: instalar
        run: |
          # IP pública de la instancia (servicio de metadatos de EC2, IMDSv2)
          TOKEN=$(curl -fsS -m 5 -X PUT http://169.254.169.254/latest/api/token \
                    -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)
          HOST=$(curl -fsS -m 5 -H "X-aws-ec2-metadata-token: $TOKEN" \
                    http://169.254.169.254/latest/meta-data/public-ipv4 || true)
          echo "IP pública: ${HOST:-no disponible}"
          sudo bash paquete/ec2-setup.sh "$PWD/paquete" "$HOST"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

  verificar:
    name: Comprobar desde internet
    needs: deploy
    if: needs.deploy.outputs.host != ''
    runs-on: ubuntu-latest
    env:
      HOST: ${{ needs.deploy.outputs.host }}
    steps:
      - name: La página y la API responden en el puerto 80
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "http://$HOST/api/health"
          echo
          curl -fsS "http://$HOST/api/products" | head -c 300
          echo
          curl -fsS "http://$HOST/" | grep -q '<div id="root">'
          echo "### Desplegado: http://$HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "Swagger: http://$HOST/swagger-ui.html" >> "$GITHUB_STEP_SUMMARY"
