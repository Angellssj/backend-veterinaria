# ---------------------------------------------------------------
# Perfil de producción (AWS). Se activa con SPRING_PROFILES_ACTIVE=prod
# Todas las credenciales llegan por variables de entorno (nunca en el repo):
#   DB_URL       jdbc:mysql://<endpoint-rds>:3306/veterinaria
#   DB_USERNAME  usuario maestro de RDS (ej: admin)
#   DB_PASSWORD  contraseña de RDS
#   JWT_SECRET   texto aleatorio de 32+ caracteres
#   APP_CORS_ORIGINS  URL del frontend (ej: http://mi-bucket.s3-website-us-east-1.amazonaws.com)
#   PORT         5000 en Elastic Beanstalk
# ---------------------------------------------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

# En producción la consola H2 no existe
spring.h2.console.enabled=false

# Sin valor por defecto: si falta JWT_SECRET la app no arranca (evita usar el secreto de desarrollo)
app.jwt.secret=${JWT_SECRET}
