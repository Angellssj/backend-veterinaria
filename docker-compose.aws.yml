services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: veterinaria
      MYSQL_USER: veterinaria_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./veterinaria
      dockerfile: Dockerfile
    restart: unless-stopped
    # Por defecto la API solo escucha en la propia EC2 (127.0.0.1); el navegador entra por
    # Nginx en el puerto 80 (/api). Pon SPRING_BIND=0.0.0.0 en .env para exponer el 8080.
    ports:
      - "${SPRING_BIND:-127.0.0.1}:${SPRING_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/veterinaria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: veterinaria_app
      DB_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      APP_ADMIN_EMAIL: "${APP_ADMIN_EMAIL:-admin@sanmarcos.cl}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}"
      APP_SEED_DEMO_CLIENT: "${APP_SEED_DEMO_CLIENT:-false}"
      # El frontend usa el mismo origen (Nginx /api), así que CORS solo hace falta para
      # clientes externos, por ejemplo Vite en desarrollo.
      APP_CORS_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
    restart: unless-stopped
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
