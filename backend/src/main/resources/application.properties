spring.application.name=veterinaria

# ---------------------------------------------------------------
# Configuración por defecto (desarrollo local): H2 en memoria.
# En Docker y AWS se activa el perfil "prod" (application-prod.properties)
# con SPRING_PROFILES_ACTIVE=prod y las variables de conexión MySQL.
# ---------------------------------------------------------------

# Puerto: 8080 en local. En Elastic Beanstalk se define la variable PORT=5000.
server.port=${PORT:8080}

# Base de datos H2 en memoria, en modo compatible con MySQL
spring.datasource.url=jdbc:h2:mem:veterinaria;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway crea el esquema; Hibernate valida que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Swagger / OpenAPI -> http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT: el secreto debe tener al menos 32 caracteres. En producción se define con JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-secret-veterinaria-san-marcos-cambiar-en-produccion-2026}
app.jwt.access-minutes=15
app.jwt.refresh-days=7

# Orígenes permitidos por CORS (separados por coma). En AWS: la URL del frontend en S3.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Usuarios de demostración que se crean al arrancar si no existen
app.seed.admin-email=${APP_ADMIN_EMAIL:admin@sanmarcos.cl}
app.seed.admin-password=${APP_ADMIN_PASSWORD:Admin123!}
app.seed.demo-client=${APP_SEED_DEMO_CLIENT:true}
